# Shopify Ruby styling for Rails
inherit_gem: { rubocop-shopify: rubocop.yml }

plugins:
  - rubocop-rails
  - rubocop-minitest
  - rubocop-thread_safety

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
