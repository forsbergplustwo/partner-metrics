[tools]
ruby = "3.2.9"
node = "24.8.0"

[tasks.install]
description = "Install Ruby and JS dependencies"
depends = ["install:ruby", "install:js"]

[tasks."install:ruby"]
description = "Install Ruby dependencies"
run = "bundle install"

[tasks."install:js"]
description = "Install JS dependencies"
run = [
  "pnpm install",
  "pnpm --dir site install"
]

[tasks.setup]
description = "Install dependencies and prepare databases"
depends = ["install"]
run = "bin/setup"

[tasks.test]
description = "Run the Rails test suite used in CI"
depends = ["setup"]
run = "bin/rails test"

[tasks.ci]
description = "Run app CI checks"
depends = ["test"]

[tasks.lint]
description = "Run all linters"
run = ["mise lint:ruby", "mise lint:js"]

[tasks."lint:ruby"]
description = "Lint Ruby code with Standard"
depends = ["install:ruby"]
run = "bundle exec standardrb --fix --format github"

[tasks."lint:js"]
description = "Check frontend asset formatting with Prettier"
depends = ["install:js"]
run = "pnpm run lint:js"

[tasks.security]
description = "No-op placeholder for shared security workflow"
depends = ["install:ruby"]
run = "bundle exec brakeman -q -w2 --no-exit-on-error"

[tasks."deploy:shopify"]
description = "Deploy app via Shopify CLI"
depends = ["install:js"]
run = "pnpm shopify:deploy"

[tasks."install:aptfile"]
description = "Install OS packages from Aptfile when running in GitHub Actions"
run = """
if [ "${GITHUB_ACTIONS:-}" != "true" ]; then
  echo "Skipping install:system outside GitHub Actions"
  exit 0
fi
sudo apt-get update -qq
xargs -a Aptfile sudo apt-get install -yqq
"""

[tasks."worktree:setup"]
description = "Set up a git worktree for development (symlink keys, install deps)"
dir = "{{cwd}}"
depends_post = ["install"]
run = """
MAIN_REPO=$(git worktree list | head -1 | awk '{print $1}')
CURRENT_TOPLEVEL=$(git rev-parse --show-toplevel)
if [ "$CURRENT_TOPLEVEL" = "$MAIN_REPO" ]; then
  echo "ERROR: worktree:setup must not run from the main worktree" >&2
  exit 1
fi
for key in config/master.key config/credentials/test.key; do
  if [ -f "$MAIN_REPO/$key" ]; then
    mkdir -p "$(dirname "$key")"
    ln -sf "$MAIN_REPO/$key" "$key"
  else
    echo "ERROR: Required key missing in main repo: $key" >&2
    exit 1
  fi
done
mise install
"""
